# Local stack for trying the federated task flow end to end (see README.md next to this file).
# Local development only: every password and secret below is a throwaway dev value.
#
#   docker compose -f dev/federated/docker-compose.yml up -d --build
#
# Browsers and curl on the host use localhost; containers talk to each other by service name.
# Keycloak's dynamic backchannel lets both work: tokens carry the localhost issuer, and the APIs
# skip issuer-name checks (KeycloakCommon / Submission JwtBearer), so internal discovery is fine.
# Agent.Api and the Egress app do check the issuer, against Authority: theirs is the localhost URL, while discovery,
# keys and tokens go through MetadataAddress / BaseUrl on keycloak:8080.

name: federated-dev

x-keycloak-urls: &kc-dare-control
  SubmissionKeyCloakSettings__Authority: http://keycloak:8080/realms/Dare-Control
  SubmissionKeyCloakSettings__MetadataAddress: http://keycloak:8080/realms/Dare-Control/.well-known/openid-configuration
  SubmissionKeyCloakSettings__BaseUrl: http://keycloak:8080/realms/Dare-Control
  SubmissionKeyCloakSettings__ClientId: Dare-Control-API
  SubmissionKeyCloakSettings__ClientSecret: dev-dare-control-api-secret
  SubmissionKeyCloakSettings__Server: keycloak:8080
  SubmissionKeyCloakSettings__Protocol: http
  SubmissionKeyCloakSettings__RequireHttpsMetadata: "false"

services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 3s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      # The image has no curl; ask the management port's readiness endpoint over bash's /dev/tcp.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      retries: 60

  # The TRE's object store: holds the federated-datasets bucket. Uploaders log in through Keycloak (realm tre-test).
  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin123
      RUSTFS_IDENTITY_OPENID_ENABLE: "on"
      RUSTFS_IDENTITY_OPENID_CONFIG_URL: http://keycloak:8080/realms/tre-test
      RUSTFS_IDENTITY_OPENID_CLIENT_ID: rustfs-console
      RUSTFS_IDENTITY_OPENID_CLIENT_SECRET: rustfs-secret
      RUSTFS_IDENTITY_OPENID_SCOPES: openid,profile,email
      RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM: groups
      RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM: preferred_username
      RUSTFS_IDENTITY_OPENID_EMAIL_CLAIM: email
      RUSTFS_IDENTITY_OPENID_REDIRECT_URI: http://localhost:9000/rustfs/admin/v3/oidc/callback/default
      RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC: "off"
      RUSTFS_IDENTITY_OPENID_DISPLAY_NAME: TRE Keycloak
      # RustFS blocks outbound calls to private addresses; allow its OIDC discovery to reach Keycloak (the origin must match the host of RUSTFS_IDENTITY_OPENID_CONFIG_URL).
      RUSTFS_OUTBOUND_ALLOW_ORIGINS: http://keycloak:8080
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfsdata:/data
    depends_on:
      keycloak:
        condition: service_healthy

  # The orchestrator's own object store: holds the federated-results bucket (result files uploaded by Agents).
  # Separate from the TRE's RustFS above; no OIDC.
  rustfs-orchestrator:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_ACCESS_KEY: orchadmin
      RUSTFS_SECRET_KEY: orchadmin123
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - rustfsorchdata:/data

  submission-api:
    build:
      context: ../..
      dockerfile: Submission/Submission.Api/Dockerfile
    environment:
      <<: *kc-dare-control
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=postgres;Port=5432;Database=DARE-Control;User Id=postgres;Password=postgres;Include Error Detail=true
      KeycloakDemoMode: "true"
      Features__SeedDemoData: "false"
      RabbitMQ__HostAddress: rabbitmq-not-used
      # Dev uses the RustFS root key; production uses a dedicated account limited to the federated-results bucket.
      FederatedResultsStorageSettings__Url: http://rustfs-orchestrator:9000
      FederatedResultsStorageSettings__AccessKey: orchadmin
      FederatedResultsStorageSettings__SecretKey: orchadmin123
    ports:
      - "5034:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rustfs-orchestrator:
        condition: service_started

  agent-api:
    build:
      context: ../..
      dockerfile: Agent/Agent.Api/Dockerfile
    environment:
      <<: *kc-dare-control
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=postgres;Port=5432;Database=DARE-TRE;User Id=postgres;Password=postgres;Include Error Detail=true
      ConnectionStrings__CredentialsConnection: Server=postgres;Port=5432;Database=TRE_Credentials;User Id=postgres;Password=postgres;Include Error Detail=true
      KeycloakDemoMode: "true"
      Features__SeedDemoData: "false" # must stay false: seeding writes to Vault, which this stack doesn't run
      TreName: my-tre
      ApiEndpoints__SubmissionApiUrl: http://submission-api:8080
      # The Agent talks to Submission as the TRE service account (client tre-my-tre, realm role dare-tre-admin).
      # These override the Dare-Control-API client set by the anchor, and match what OnboardingService stores.
      SubmissionKeyCloakSettings__ConfigInputMethod: Upload
      SubmissionKeyCloakSettings__ClientId: tre-my-tre
      SubmissionKeyCloakSettings__ClientSecret: dev-tre-my-tre-secret
      SubmissionKeyCloakSettings__Username: tre-my-tre
      SubmissionKeyCloakSettings__PasswordEnc: dev-tre-my-tre-secret
      # The Agent checks the issuer of incoming tokens against Authority, so it is the localhost issuer the tokens carry;
      # the keys come from MetadataAddress. Dare-TRE-API is the audience of the Egress app's callback token.
      TreKeyCloakSettings__Authority: http://localhost:8180/realms/tre-test
      TreKeyCloakSettings__MetadataAddress: http://keycloak:8080/realms/tre-test/.well-known/openid-configuration
      TreKeyCloakSettings__ValidAudiences: Dare-TRE-API,Dare-TRE-UI
      # Output approval: the Agent registers each result with the Egress app as the service account of client
      # tre-agent (realm Data-Egress, role dare-tre-admin), then acts on the reviewer's decision as soon as it arrives.
      ApiEndpoints__EgressApiUrl: http://egress-api:8080
      DataEgressKeyCloakSettings__Authority: http://localhost:8180/realms/Data-Egress
      DataEgressKeyCloakSettings__MetadataAddress: http://keycloak:8080/realms/Data-Egress/.well-known/openid-configuration
      # The Agent's service account in the Egress realm, used to register results for review.
      FederatedEgressSettings__BaseUrl: http://keycloak:8080/realms/Data-Egress
      FederatedEgressSettings__ClientId: tre-agent
      FederatedEgressSettings__ClientSecret: dev-tre-agent-egress-secret
      # Admin key: the Agent creates the dataset bucket and the dataset-upload policy at startup.
      MinioTRESettings__Url: http://rustfs:9000
      MinioTRESettings__AccessKey: rustfsadmin
      MinioTRESettings__SecretKey: rustfsadmin123
      JobSettings__federatedTaskSchedule: "1"
      # The Agent's other jobs need services this stack doesn't run; switch them off to keep logs readable.
      JobSettings__syncSchedule: "0"
      JobSettings__scanSchedule: "0"
      JobSettings__healthCheckSchedule: "0"
      JobSettings__bucketCleanupSchedule: "0"
      HasuraSettings__IsEnabled: "false"
      RabbitMQ__HostAddress: rabbitmq-not-used
      Hangfire__Username: admin
      Hangfire__Password: password
    ports:
      - "5269:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      rustfs:
        condition: service_started
      submission-api:
        condition: service_started

  # The hospital's Data Egress app: a reviewer approves or rejects each federated result before it leaves the TRE.
  # Reviewers log in through realm Data-Egress; the app calls the Agent back as user egress-app of realm tre-test.
  egress-api:
    build:
      context: ../..
      dockerfile: Egress/Data-Egress-API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=postgres;Port=5432;Database=DataEgress;User Id=postgres;Password=postgres;Include Error Detail=true
      KeycloakDemoMode: "true"
      DemoMode: "false"
      # Incoming tokens are checked against Authority (the localhost issuer they carry); keys come from MetadataAddress.
      DataEgressKeyCloakSettings__Authority: http://localhost:8180/realms/Data-Egress
      DataEgressKeyCloakSettings__MetadataAddress: http://keycloak:8080/realms/Data-Egress/.well-known/openid-configuration
      DataEgressKeyCloakSettings__BaseUrl: http://keycloak:8080/realms/Data-Egress
      DataEgressKeyCloakSettings__Realm: Data-Egress
      DataEgressKeyCloakSettings__ClientId: Data-Egress-API
      DataEgressKeyCloakSettings__ClientSecret: dev-data-egress-api-secret
      DataEgressKeyCloakSettings__ValidAudiences: Data-Egress-API,Data-Egress-UI
      # The login the app uses to call the Agent back (stored by seed-egress-creds below).
      TreKeyCloakSettings__Authority: http://localhost:8180/realms/tre-test
      TreKeyCloakSettings__MetadataAddress: http://keycloak:8080/realms/tre-test/.well-known/openid-configuration
      TreKeyCloakSettings__BaseUrl: http://keycloak:8080/realms/tre-test
      TreKeyCloakSettings__Realm: tre-test
      TreKeyCloakSettings__ClientId: Dare-TRE-API
      TreKeyCloakSettings__ClientSecret: dev-dare-tre-api-secret
      TreAPISettings__Address: http://agent-api:8080
      DataEgressAPISettings__Address: http://localhost:5279
      MinioSettings__Url: http://rustfs:9000
      MinioSettings__AccessKey: rustfsadmin
      MinioSettings__SecretKey: rustfsadmin123
      # Email is off (EmailSettings:Enabled is false); a send failure would only be logged.
      EmailSettings__EmailOverride: reviewer@localhost
    ports:
      - "5279:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  egress-ui:
    build:
      context: ../..
      dockerfile: Egress/Data-Egress-UI/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      KeycloakDemoMode: "true"
      DemoMode: "false"
      # The browser is sent to Keycloak on localhost; the UI fetches discovery, tokens and keys from keycloak:8080.
      DataEgressKeyCloakSettings__Authority: http://localhost:8180/realms/Data-Egress
      DataEgressKeyCloakSettings__MetadataAddress: http://keycloak:8080/realms/Data-Egress/.well-known/openid-configuration
      DataEgressKeyCloakSettings__BaseUrl: http://keycloak:8080/realms/Data-Egress
      DataEgressKeyCloakSettings__AccountManagementURL: http://localhost:8180/realms/Data-Egress/account
      DataEgressKeyCloakSettings__ClientId: Data-Egress-UI
      DataEgressKeyCloakSettings__ClientSecret: dev-data-egress-ui-secret
      DataEgressKeyCloakSettings__TokenExpiredAddress: http://localhost:5280/Account/LoginAfterTokenExpired
      DataEgressKeyCloakSettings__Proxy: "false"
      DataEgressAPISettings__Address: http://egress-api:8080
    ports:
      - "5280:8080"
    depends_on:
      egress-api:
        condition: service_started

  # One-shot: stores egress-app's tre-test login in the Egress app, as the reviewer, so the app can call the Agent back.
  seed-egress-creds:
    image: curlimages/curl:8.10.1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until curl -sf http://egress-api:8080/health >/dev/null; do echo "waiting for the Egress API"; sleep 3; done
        token=$$(curl -sf http://keycloak:8080/realms/Data-Egress/protocol/openid-connect/token \
          -d grant_type=password -d client_id=Data-Egress-API -d client_secret=dev-data-egress-api-secret \
          -d username=reviewer -d 'password=Reviewer1!' | sed -n 's/.*"access_token":"\([^"]*\)".*/\1/p')
        [ -n "$$token" ] || { echo "no token for reviewer"; exit 1; }
        # Stored already (a restart): skip, as the upstream UpdateCredentials fails when it replaces a stored login.
        if curl -sf http://egress-api:8080/api/TreCredentials/CheckCredentialsAreValid -H "Authorization: Bearer $$token" | grep -qi '"result":true'; then
          echo "egress-app login already stored"; exit 0
        fi
        response=$$(curl -s -X POST http://egress-api:8080/api/TreCredentials/UpdateCredentials \
          -H "Authorization: Bearer $$token" -H 'Content-Type: application/json' \
          -d '{"userName":"egress-app","passwordEnc":"EgressApp1!","confirmPassword":"EgressApp1!"}')
        if echo "$$response" | grep -qi '"valid":true'; then echo "egress-app login stored"; else echo "UpdateCredentials failed: $$(echo "$$response" | sed -n 's/.*"errorMessage":\("[^"]*"\|null\).*/\1/p')"; exit 1; fi
    depends_on:
      egress-api:
        condition: service_started
    restart: "no"

  # One-shot: registers TRE "my-tre" in Submission once its migrations have created the Tres table.
  seed-tre:
    image: postgres:16.4
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: DARE-Control
    command:
      - sh
      - -c
      - |
        until psql -tAc 'SELECT 1 FROM "Tres" LIMIT 1' >/dev/null 2>&1; do echo "waiting for Submission migrations"; sleep 3; done
        psql -c "INSERT INTO \"Tres\" (\"Name\",\"AdminUsername\",\"About\",\"FormData\",\"LastHeartBeatReceived\",\"KeycloakClientId\")
                 SELECT 'my-tre','tre-agent-my-tre','Local federated dev TRE','{}',now(),'tre-my-tre'
                 WHERE NOT EXISTS (SELECT 1 FROM \"Tres\" WHERE lower(\"Name\")='my-tre');"
        psql -c "UPDATE \"Tres\" SET \"KeycloakClientId\"='tre-my-tre' WHERE lower(\"Name\")='my-tre' AND (\"KeycloakClientId\" IS NULL OR \"KeycloakClientId\" = '');"
    depends_on:
      submission-api:
        condition: service_started
    restart: "no"

  # One-shot: uploads the sample dataset dataset/cohort_2024/cohort.csv into the TRE bucket.
  seed-dataset:
    image: amazon/aws-cli:2.15.0
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin123
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./data:/seed:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws --endpoint-url http://rustfs:9000 s3 ls >/dev/null 2>&1; do echo "waiting for RustFS"; sleep 3; done
        aws --endpoint-url http://rustfs:9000 s3 mb s3://federated-datasets 2>/dev/null || true
        aws --endpoint-url http://rustfs:9000 s3 cp /seed/cohort.csv s3://federated-datasets/dataset/cohort_2024/cohort.csv
    depends_on:
      rustfs:
        condition: service_started
    restart: "no"

volumes:
  pgdata:
  rustfsdata:
  rustfsorchdata:
