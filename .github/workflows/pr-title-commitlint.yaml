name: PR Title Commitlint

on:
  pull_request:
    # Run on all PRs whenever the title could have changed
    types:
      - opened
      - reopened
      - edited
      - synchronize

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # This linting can be cancelled if there is a newer commit to lint
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the commitlint config
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .github/commitlint.config.mjs

      - name: Install node
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24

      - name: Install commitlint
        run: npm install --no-save @commitlint/cli@21.2.4 @commitlint/config-conventional@21.2.4

      - name: Lint the PR title
        # The title is passed through the environment, never interpolated into the script.
        run: echo "$TITLE" | npx --no-install commitlint --config .github/commitlint.config.mjs
        env:
          TITLE: ${{ github.event.pull_request.title }}
